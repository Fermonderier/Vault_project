[package]
name = "liquidity-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "liquidity_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
devnet = ["raydium-clmm-cpi/devnet"]

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.30.1", features = ["associated_token", "memo", "metadata", "token", "token_2022"] }
# Keep Anchor's derive helper aligned with the Borsh version used by Anchor.
borsh-derive-internal = "=0.10.4"
raydium-clmm-cpi = { git = "https://github.com/raydium-io/raydium-cpi", rev = "31338e2504e4a23172bdbbb49e05b10566594b14", features = ["no-idl"] }
